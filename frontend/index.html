<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap"
      rel="stylesheet"
    />

    <title>Memory Game - Space Theme</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-controls">
      <button id="restart-btn" class="hidden">🚀 Restart Mission</button>
    </div>
    <div class="level-controls">
      <button data-level="1">🟢 Easy</button>
      <button data-level="2">🟡 Medium</button>
      <button data-level="3">🔴 Hard</button>
    </div>
    <div class="game-info">
      <p class="info-block">
        <span class="label">🚀 Reveals:</span>
        <span id="reveal-count">0</span>
      </p>
      <p class="info-block">
        <span class="label">⏱ Time:</span>
        <span id="timer">0</span>s
      </p>
    </div>

    <div id="game-board"></div>

    <div id="popup" class="popup hidden">
      <div class="popup-content">
        <p id="popup-message"></p>
        <button id="popup-close">Close</button>
      </div>
    </div>

    <div id="score-modal" class="popup hidden">
      <div class="popup-content score-box">
        <h2>🌌 Mission Complete!</h2>
        <p id="final-score-text"></p>

        <input type="text" id="player-name" placeholder="Enter Your Name" />

        <button id="save-score-btn">🚀 Save Score</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
